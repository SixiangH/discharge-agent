services:
  - type: web
    name: discharge-agent-demo
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCHARGE_LLM_ENABLED
        value: "false"
      - key: EXTERNAL_EVIDENCE_ENABLED
        value: "false"
